name: CI Production Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-quality-gate:
    name: Backend quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install deps
        run: |
          uv sync --package aiq-agent
          uv pip install pytest pytest-cov ruff pip-audit
          uv pip install -e ./frontends/aiq_api
          uv pip install -e ./sources/tavily_web_search
          uv pip install -e ./sources/google_scholar_paper_search

      - name: Ruff
        run: uv run ruff check src/aiq_agent frontends/aiq_api/src/aiq_api

      - name: Pytest smoke + coverage xml
        run: |
          uv run pytest frontends/aiq_api/tests/test_auth.py frontends/aiq_api/tests/test_auth_errors.py frontends/aiq_api/tests/test_periodic_cleanup.py -q --cov=src/aiq_agent --cov-report=xml

      - name: Pip audit (report only)
        run: uv run pip-audit --skip-editable || true

      - name: Upload backend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-artifacts
          path: |
            coverage.xml

  frontend-quality-gate:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: npm audit (high)
        run: npm audit --audit-level=high

      - name: Upload frontend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-artifacts
          path: |
            frontends/ui/.next
