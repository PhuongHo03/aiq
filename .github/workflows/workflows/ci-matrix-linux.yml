name: CI Matrix Linux

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  linux-amd64:
    name: Linux amd64 checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend deps (smoke)
        run: |
          uv sync --package aiq-agent
          uv pip install -e ./frontends/aiq_api
          uv pip install -e ./sources/tavily_web_search
          uv pip install -e ./sources/google_scholar_paper_search

      - name: Validate setup script syntax
        run: bash -n ./setup.sh

  linux-arm64-smoke:
    name: Linux arm64 smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Arm64 container smoke
        run: |
          docker run --rm --platform linux/arm64 python:3.12-slim python -V
          docker run --rm --platform linux/arm64 python:3.12-slim bash -lc "apt-get update >/dev/null && apt-get install -y git >/dev/null && git --version"
